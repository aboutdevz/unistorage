run:
  timeout: 5m
  go: '1.22'
  tests: true
issues:
  exclude-dirs:
    - vendor
    - testdata
    - .agents
    - bin
  exclude-rules:
    - path: (_test\.go|tests/)
      linters:
        - errcheck
        - gosec
        - revive
        - gocritic
        - bodyclose
        - noctx
        - prealloc
    - text: "stutters; consider calling this"
      linters:
        - revive
    - linters:
        - gocritic
      text: "(hugeParam|octalLiteral|paramTypeCombine|stringXbytes|ifElseChain|unnamedResult|evalOrder|rangeValCopy)"

linters-settings:
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # Audit unhandled errors (handled via errcheck)
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    # check-shadowing: true
    # enable-all: true
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      # - security

linters:
  enable:
    - gosec          # AST-based security auditing
    - errcheck       # Ensure errors are checked
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Advanced Go static analysis
    - unused         # Find unused variables/functions
    - govet          # Official Go vet checks
    - revive         # Fast, configurable linter
    - gocritic       # Micro-optimizations & code bugs
    - bodyclose      # Ensure HTTP response bodies are closed
    - noctx          # Prevent HTTP requests without context
    - prealloc       # Slice preallocation hints
    # - exportloopref  # Detect loop variable pointer capture (inactivated in Go 1.22+)

