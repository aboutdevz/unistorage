version: "3.8"

networks:
  unistorage-dev-net:
    driver: bridge

volumes:
  unistorage-config:
    driver: local
  unistorage-data:
    driver: local
  minio-data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # MinIO: Local S3 Mock Storage Server
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: unistorage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - unistorage-dev-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # MinIO Bucket Auto-Provisioning (One-Shot Initializer)
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: unistorage-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - unistorage-dev-net
    entrypoint: >
      /bin/sh -c "
      echo 'Configuring MinIO client alias...';
      /usr/bin/mc alias set dev-s3 http://minio:9000 minioadmin minioadmin;
      echo 'Creating default development buckets...';
      /usr/bin/mc mb --ignore-existing dev-s3/unistorage-dev-bucket;
      /usr/bin/mc mb --ignore-existing dev-s3/test-bucket;
      /usr/bin/mc mb --ignore-existing dev-s3/backup-bucket;
      echo 'Setting bucket policies...';
      /usr/bin/mc anonymous set download dev-s3/unistorage-dev-bucket || true;
      echo 'MinIO buckets successfully initialized!';
      exit 0;
      "
    restart: "no"

  # ----------------------------------------------------------------------------
  # UniStorage Daemon: Core Service Container
  # ----------------------------------------------------------------------------
  unistorage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.0-dev"
        COMMIT: "local"
        BUILD_TIME: "dev"
    container_name: unistorage-daemon
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      UNISTORAGE_DAEMON_PORT: "8080"
      UNISTORAGE_DAEMON_ADDR: "0.0.0.0"
      UNISTORAGE_CONFIG_DIR: "/config"
      UNISTORAGE_DATA_DIR: "/data"
      UNISTORAGE_LOG_LEVEL: "debug"
      UNISTORAGE_S3_ENDPOINT: "http://minio:9000"
      UNISTORAGE_S3_REGION: "us-east-1"
      UNISTORAGE_S3_BUCKET: "unistorage-dev-bucket"
      UNISTORAGE_S3_ACCESS_KEY: "minioadmin"
      UNISTORAGE_S3_SECRET_KEY: "minioadmin"
    volumes:
      - unistorage-config:/config
      - unistorage-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    networks:
      - unistorage-dev-net
