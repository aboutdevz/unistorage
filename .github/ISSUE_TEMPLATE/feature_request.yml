name: "Feature Request"
description: "Suggest a new feature or enhancement for UniStorage"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please check existing issues and discussions to see if your idea has already been proposed.
  - type: dropdown
    id: component
    attributes:
      label: "Target Subsystem"
      description: "Which part of UniStorage does this feature impact?"
      options:
        - "Storage Drivers (New driver like SFTP, WebDAV, Azure Blob, etc.)"
        - "Sync Engine (Delta sync, compression, filtering)"
        - "CLI Interface (New commands or flags)"
        - "Daemon & REST/gRPC API"
        - "Vault & Security"
        - "Container & Infrastructure"
        - "Web / Desktop / UI"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Is your feature request related to a specific problem or friction point? Please describe."
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you've considered."
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Add any other context, mockups, or architectural diagrams."
