name: UniStorage CD & Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Multi-Platform Binary Compilation & Packaging
  # ----------------------------------------------------------------------------
  build-binaries:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          # Darwin (macOS)
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          # Windows
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Hardened Static Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          OUTPUT_DIR=dist/unistorage_${TAG_NAME}_${{ matrix.os }}_${{ matrix.arch }}
          mkdir -p $OUTPUT_DIR
          
          go build -trimpath \
            -ldflags="-s -w -X 'main.Version=${TAG_NAME}' -X 'main.Commit=${COMMIT_SHA}' -X 'main.BuildTime=${BUILD_TIME}'" \
            -o "${OUTPUT_DIR}/unistorage${{ matrix.ext }}" \
            ./cmd/unistorage
          
          # Copy license & docs
          cp README.md LICENSE* "${OUTPUT_DIR}/" 2>/dev/null || true
          
          # Package archive
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "unistorage_${TAG_NAME}_${{ matrix.os }}_${{ matrix.arch }}.zip" "unistorage_${TAG_NAME}_${{ matrix.os }}_${{ matrix.arch }}"
          else
            tar -czvf "unistorage_${TAG_NAME}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "unistorage_${TAG_NAME}_${{ matrix.os }}_${{ matrix.arch }}"
          fi
          cd ..

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz dist/*.zip

  # ----------------------------------------------------------------------------
  # 2. Multi-Arch Container Image Build & Publish (GHCR)
  # ----------------------------------------------------------------------------
  publish-container:
    name: Build & Publish Container Images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------------------------------------------------------
  # 3. Release Signing, Checksums & GitHub Release Publication
  # ----------------------------------------------------------------------------
  publish-release:
    name: Publish Release & Attestation
    needs: [build-binaries, publish-container]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate Cryptographic SHA-256 Checksums
        run: |
          cd release-artifacts
          find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv -f {} . \; 2>/dev/null || true
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} + | sed 's| \./| |' > checksums.txt
          cat checksums.txt
          cd ..

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Checksums with Cosign Keyless Signing
        run: |
          cd release-artifacts
          cosign sign-blob --yes checksums.txt \
            --bundle checksums.txt.bundle \
            --output-certificate checksums.txt.cert \
            --output-signature checksums.txt.sig || \
          cosign sign-blob --yes checksums.txt \
            --bundle checksums.txt.bundle || true
          cd ..

      - name: Generate Release SBOM with Syft
        uses: anchore/sbom-action/download-syft@v0.16.0

      - name: Create CycloneDX Release SBOM
        run: |
          syft dir:. -o cyclonedx-json=release-artifacts/sbom.cyclonedx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt*
            release-artifacts/sbom.cyclonedx.json
          generate_release_notes: true
          draft: false
          prerelease: false
